<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Oath of Power — Presidential Simulator</title>
<style>
:root{--bg:#070b14;--panel:#101a2b;--panel2:#14243a;--line:#2b405b;--gold:#f2c35b;--text:#edf3ff;--muted:#9eacc2;--red:#ff777e;--green:#79e0b0;--blue:#76b8ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#183354 0,transparent 43%),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #405a7a;background:#203a59;color:var(--text);border-radius:10px;padding:11px 14px;font-weight:700;transition:transform .15s,border-color .15s,background .15s}button:hover{border-color:var(--gold);transform:translateY(-1px)}button.primary{background:var(--gold);color:#111827;border-color:#ffe09a}button.danger{background:#512b38;border-color:#8c4c5b}button:disabled{opacity:.45;cursor:not-allowed;transform:none}input,select,textarea{width:100%;background:#091321;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:10px;margin:5px 0 12px}label{display:block;color:var(--muted);font-size:13px;font-weight:700}.shell{max-width:1500px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:8px 0 18px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:13px}.seal{width:52px;height:52px;border:2px solid var(--gold);color:var(--gold);border-radius:50%;display:grid;place-items:center;font-size:27px}.eyebrow{color:var(--gold);letter-spacing:2px;font-size:11px;font-weight:900}.brand h1{font-size:23px;letter-spacing:2px;margin:0}.muted{color:var(--muted)}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:16px}.stat,.panel,.card{background:linear-gradient(145deg,#122238,#0c1727);border:1px solid var(--line);border-radius:14px}.stat{padding:13px}.stat span{display:block;color:var(--muted);font-size:11px;letter-spacing:1px;font-weight:800}.stat strong{display:block;font-size:24px;margin:2px 0}.meter{height:6px;border-radius:99px;background:#29394d;overflow:hidden}.meter i{display:block;height:100%;background:var(--gold);border-radius:99px}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}.sidebar{align-self:start;position:sticky;top:10px;padding:12px;background:#0e1b2d;border:1px solid var(--line);border-radius:14px}.navtitle{padding:8px;color:var(--muted);font-size:11px;letter-spacing:2px;font-weight:900}.nav{display:block;width:100%;text-align:left;margin:3px 0;background:transparent;border-color:transparent;padding:10px}.nav.active{background:#284565;border-color:#456687;color:#ffe08a}.main{min-width:0}.hero{padding:22px;background:linear-gradient(110deg,#183452,#0c1728 75%);border:1px solid #304c6c;border-radius:16px;margin-bottom:14px}.hero h2{font-size:clamp(25px,4vw,38px);line-height:1.15;margin:5px 0 9px}.hero p{max-width:760px;color:#bac7d9;margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:17px;display:flex;flex-direction:column;gap:9px}.card h3{margin:0;font-size:19px}.card p{color:var(--muted);margin:0;flex:1}.tag{display:inline-flex;align-self:flex-start;border-radius:6px;padding:4px 8px;background:#26384e;color:#cbd8eb;font-size:10px;letter-spacing:1px;font-weight:900}.tag.gold{background:#4d3b1a;color:#ffdd8a}.tag.red{background:#502a35;color:#ffb4b8}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 10px}.sectionhead h2{margin:0}.feed{display:grid;gap:8px}.event{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#0b1625}.event strong{display:block}.event small{color:var(--muted)}.event p{margin:5px 0 0;color:#c4d0e0}.formrow{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.pill{display:inline-block;border:1px solid var(--line);padding:5px 9px;border-radius:99px;color:var(--muted);font-size:12px}.choice{display:flex;flex-direction:column;gap:8px;margin-top:10px}.choice button{text-align:left;white-space:normal}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#eaf4ff;color:#0a1525;padding:11px 16px;border-radius:10px;font-weight:800;box-shadow:0 8px 30px #0008;z-index:10;max-width:90vw}.footer{color:var(--muted);font-size:12px;text-align:center;margin:22px 0}.barrow{display:grid;grid-template-columns:130px 1fr 40px;gap:10px;align-items:center;margin:12px 0}.barrow .meter{height:9px}.modalback{position:fixed;inset:0;background:#02050bd9;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(640px,100%);max-height:90vh;overflow:auto;background:#101d30;border:1px solid #45617f;border-radius:16px;padding:20px;box-shadow:0 25px 100px #000a}.modal h2{margin-top:0}.close{float:right}.kbd{font-size:11px;color:var(--muted)}@media(max-width:1000px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{grid-template-columns:1fr}.sidebar{position:static;display:flex;overflow-x:auto;gap:4px}.navtitle{display:none}.nav{width:auto;min-width:max-content}.shell{padding:12px}}@media(max-width:620px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid,.formrow{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.brand h1{font-size:19px}.stat strong{font-size:21px}.barrow{grid-template-columns:100px 1fr 35px}}
</style>
</head>
<body>
<div class="shell">
<header class="top">
 <div class="brand"><div class="seal">★</div><div><div class="eyebrow">PRESIDENTIAL STRATEGY SIMULATOR</div><h1>OATH OF POWER</h1><div class="muted">A fictional government. Consequences are real within the game.</div></div></div>
 <div class="top-actions"><button id="saveBtn">Save Game</button><button id="loadBtn">Load Game</button><button id="newBtn">New Presidency</button></div>
</header>
<div class="stats" id="stats"></div>
<div class="layout">
 <aside class="sidebar"><div class="navtitle">THE WEST WING</div><div id="nav"></div></aside>
 <main class="main" id="main"></main>
</div>
<div class="footer">OATH OF POWER · FICTIONAL POLITICAL SIMULATION · Your choices shape this presidency.</div>
</div>
<div id="modalRoot"></div><div id="toast" class="toast hidden"></div>
<script>
const sections=[
['briefing','▣','Situation Room'],['schedule','◷','Daily Schedule'],['executive','✦','Executive Actions'],['congress','▤','Congress & Bills'],['cabinet','♙','Cabinet & DOJ'],['economy','↗','Economy & Budget'],['security','⚑','National Security'],['diplomacy','◎','Diplomacy'],['press','▣','Press Room'],['courts','⚖','Courts & Constitution'],['elections','◇','Public & Elections'],['legacy','★','Presidential Legacy']];
const initial=()=>({name:'Alex Morgan',party:'Independent',day:1,hour:8,term:1,approval:52,trust:61,support:48,economy:56,stability:72,treasury:42,energy:68,health:64,climate:55,navy:60,foreign:57,staff:65,section:'briefing',log:[{day:1,hour:8,title:'The oath is taken',text:'You have entered a demanding office. Your first decisions will set the tone.'}],bills:[],orders:[],cabinet:[{role:'Chief of Staff',name:'Jordan Ellis',loyalty:72},{role:'Secretary of State',name:'Maya Chen',loyalty:68},{role:'Treasury Secretary',name:'Robert Hayes',loyalty:61},{role:'Attorney General',name:'Elena Brooks',loyalty:75},{role:'National Security Adviser',name:'Sam Rivera',loyalty:64}],crisis:null,done:[],actions:0});
let G=initial(), current='briefing';
const $=id=>document.getElementById(id);
const clamp=(n,a=0,b=100)=>Math.max(a,Math.min(b,n));
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2400)}
function log(title,text){G.log.unshift({day:G.day,hour:G.hour,title,text});G.log=G.log.slice(0,35)}
function change(obj){for(const [k,v] of Object.entries(obj)){if(typeof G[k]==='number')G[k]=clamp(G[k]+v,0,k==='treasury'?200:100)}}
function renderStats(){const stats=[['PUBLIC APPROVAL','approval','%'],['PUBLIC TRUST','trust','%'],['CONGRESSIONAL SUPPORT','support','%'],['ECONOMIC CONFIDENCE','economy','%'],['NATIONAL STABILITY','stability','%'],['FEDERAL TREASURY','treasury','B']];$('stats').innerHTML=stats.map(([n,k,u])=>`<div class="stat"><span>${n}</span><strong>${G[k]}${u}</strong><div class="meter"><i style="width:${Math.min(100,G[k]/(k==='treasury'?2:1))}%"></i></div></div>`).join('')}
function renderNav(){$('nav').innerHTML=sections.map(([id,ico,name])=>`<button class="nav ${current===id?'active':''}" data-nav="${id}">${ico} ${name}</button>`).join('')}
function card(title,tag,desc,btn,fn,extra=''){return `<div class="card"><span class="tag ${tag==='URGENT'?'red':'gold'}">${tag}</span><h3>${title}</h3><p>${desc}</p>${extra}<button class="primary" data-action="${fn}">${btn} →</button></div>`}
function feed(items){return `<div class="feed">${items.map(x=>`<div class="event"><strong>${escapeHTML(x.title)}</strong><small>DAY ${x.day} · ${String(x.hour).padStart(2,'0')}:00</small><p>${escapeHTML(x.text)}</p></div>`).join('')}</div>`}
function shell(title,kicker,desc,content){return `<section class="hero"><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${desc}</p></section>${content}`}
function briefing(){return shell(`Good morning, President ${escapeHTML(G.name)}.`,`THE OVAL OFFICE · DAY ${G.day} · ${String(G.hour).padStart(2,'0')}:00`,`You have the office. You do not have unlimited time, votes, money, or public patience. Every major choice carries trade-offs.`,`
<div class="grid">
${card('Morning Intelligence Brief','CLASSIFIED','Review agency reports and identify the most urgent issue facing the country.','Open briefing','briefing_read')}
${card('Convene the Cabinet','15 MIN','Hear competing advice from senior officials before making a major decision.','Call meeting','cabinet_meeting')}
${card('Call Congressional Leaders','HIGH STAKES','Negotiate legislative priorities. Leaders may demand concessions and may leak the conversation.','Place calls','call_congress')}
${card('Address the Nation','ON RECORD','Deliver a public statement. Clear communication can reassure the public—or make a bad situation worse.','Prepare remarks','prepare_speech')}
</div><div class="sectionhead"><h2>The Situation at a Glance</h2><span class="pill">${G.actions} decisions made</span></div><div class="grid">
<div class="card"><h3>Top priority</h3><p>${G.crisis?escapeHTML(G.crisis.title):'No immediate national emergency has been declared. Your advisers recommend reviewing the economy and congressional agenda.'}</p><button data-nav="security">Review national security</button></div>
<div class="card"><h3>Presidential diary</h3><p>Day ${G.day}, ${String(G.hour).padStart(2,'0')}:00. Your term is underway. Time advances as you take actions.</p><button data-nav="schedule">Open schedule</button></div></div><div class="sectionhead"><h2>Recent developments</h2></div>${feed(G.log.slice(0,4))}`)}
function schedule(){return shell('Your time is your most limited resource.','PRESIDENTIAL DIARY','Actions use time. Advancing time can trigger new events, press scrutiny, and political consequences.',`<div class="grid">${card('Advance one hour','TIME','Move the clock forward and let events develop.','Advance hour','advance')}${card('End the day','DAILY RESET','Advance to tomorrow morning. New developments may arrive overnight.','End day','end_day')}${card('Review appointments','SCHEDULE','Review the officials and meetings already on your calendar.','View cabinet','go_cabinet')}${card('Save your progress','SAVE','Save this presidency in this browser on this device.','Save game','save') }</div><div class="sectionhead"><h2>Diary & developments</h2></div>${feed(G.log.slice(0,12))}`)}
function executive(){return shell('Executive Actions','ARTICLE II · EXECUTIVE OFFICE','Issue fictional executive orders, direct agencies, and manage the consequences. Orders can be challenged in court or opposed by Congress.',`<div class="grid">${card('Climate and energy directive','POLICY','Invest in clean energy and set federal agency priorities. Costs money, but can improve long-term confidence.','Draft directive','order_climate')}${card('Federal workforce review','MANAGEMENT','Audit agency performance. May improve efficiency, but staff morale could fall.','Start review','order_workforce')}${card('Emergency coordination order','URGENT','Coordinate federal agencies around a declared domestic emergency. Requires a credible emergency.','Coordinate agencies','order_emergency')}${card('Student loan relief proposal','DOMESTIC','Propose targeted relief. Popular with some voters; could face legal and budget challenges.','Issue proposal','order_relief')}</div><div class="sectionhead"><h2>Orders issued</h2></div>${G.orders.length?feed(G.orders):'<div class="event">No executive orders issued yet.</div>'}`)}
function congress(){return shell('The votes are not guaranteed.','THE LEGISLATIVE BRANCH','Draft bills, negotiate with lawmakers, and find out whether your coalition can pass legislation.',`<div class="grid">${card('Infrastructure and jobs bill','BIPARTISAN','Repair roads and bridges. Expensive, but could improve employment and public confidence.','Introduce bill','bill_infra')}${card('Balanced budget framework','FISCAL','Reduce spending growth and negotiate tax changes. Fiscal confidence may improve; public support may suffer.','Introduce bill','bill_budget')}${card('Healthcare access act','DOMESTIC','Expand access to basic healthcare services. Could improve public trust, with budget and vote-counting challenges.','Introduce bill','bill_health')}${card('Public safety grants','BIPARTISAN','Offer grants to local communities with oversight requirements.','Introduce bill','bill_safety')}</div><div class="sectionhead"><h2>Pending legislation</h2></div>${G.bills.length?`<div class="grid">${G.bills.map((b,i)=>`<div class="card"><span class="tag">${b.status}</span><h3>${escapeHTML(b.title)}</h3><p>${escapeHTML(b.desc)}</p><div class="actions"><button data-action="negotiate_${i}">Negotiate votes</button><button class="primary" data-action="vote_${i}">Call vote</button></div></div>`).join('')}</div>`:'<div class="event">No bills introduced. Pick a proposal above to start the legislative process.</div>'}`)}
function cabinet(){return shell('Your team is not a set of buttons.','CABINET · DEPARTMENT OF JUSTICE','Officials have distinct levels of loyalty. Meetings reveal risks, build alignment, and sometimes surface disagreement.',`<div class="grid">${G.cabinet.map((c,i)=>`<div class="card"><span class="tag">${escapeHTML(c.role)}</span><h3>${escapeHTML(c.name)}</h3><p>Loyalty and alignment: ${c.loyalty}/100</p><div class="meter"><i style="width:${c.loyalty}%"></i></div><button data-action="talk_${i}">Private briefing</button><button data-action="replace_${i}">Consider replacement</button></div>`).join('')}</div><div class="sectionhead"><h2>Department of Justice</h2></div><div class="grid">${card('Legal review','CONSTITUTION','Ask the Attorney General to review a proposed action before it is challenged.','Request review','doj_review')}${card('Ethics and disclosure','OVERSIGHT','Direct a transparent review of potential conflicts and publish findings.','Open review','ethics_review')}</div>`)}
function economy(){return shell('Budgets are choices, not magic.','TREASURY · ECONOMIC POLICY','Your treasury is shown in fictional billions. Spending can produce benefits, but borrowing and trade-offs affect confidence.',`<div class="grid">${card('Jobs and infrastructure package','INVESTMENT','Spend $5B to support infrastructure and jobs.','Fund package','econ_jobs')}${card('Small business credit','GROWTH','Spend $3B on loan guarantees and access to credit.','Fund credit','econ_small')}${card('Deficit reduction plan','FISCAL','Reduce discretionary spending by $4B. May improve fiscal confidence, but programs will object.','Reduce deficit','econ_deficit')}${card('Emergency reserve','RESILIENCE','Set aside $2B to protect response capacity for future crises.','Build reserve','econ_reserve')}</div><div class="sectionhead"><h2>Economic indicators</h2></div>${[['Economic confidence',G.economy],['Energy security',G.energy],['Public health capacity',G.health],['Climate resilience',G.climate]].map(([n,v])=>`<div class="barrow"><span>${n}</span><div class="meter"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join('')}`)}
function security(){return shell('Every alert has uncertainty.','NATIONAL SECURITY COUNCIL','Assess reports, consult advisers, and choose proportionate responses. Reckless moves can damage stability and alliances.',`<div class="grid">${card('Intelligence assessment','CLASSIFIED','Review a fictional report and distinguish confirmed facts from uncertain claims.','Review intelligence','intel')}${card('Cybersecurity incident','URGENT','A federal agency reports a serious intrusion. Coordinate investigation and public communication.','Respond to incident','cyber')}${card('Domestic disaster response','FEMA','Coordinate emergency aid and state partnerships.','Coordinate response','disaster')}${card('Readiness review','DEFENSE','Review readiness and risk without automatically escalating tensions.','Review readiness','readiness')}</div><div class="sectionhead"><h2>Current alert status</h2><span class="pill">${G.crisis?'Active situation':'Routine monitoring'}</span></div>${G.crisis?`<div class="card"><span class="tag red">ACTIVE</span><h3>${escapeHTML(G.crisis.title)}</h3><p>${escapeHTML(G.crisis.text)}</p><div class="choice">${G.crisis.choices.map((c,i)=>`<button data-action="crisis_${i}">${escapeHTML(c.label)}</button>`).join('')}</div></div>`:'<div class="event"><strong>No active crisis</strong><p>Intelligence agencies continue routine monitoring. That can change as time advances.</p></div>'}`)}
function diplomacy(){return shell('Influence is earned and alliances need maintenance.','STATE DEPARTMENT · DIPLOMACY','Build partnerships, negotiate agreements, and balance domestic priorities with international commitments.',`<div class="grid">${card('Summit with allied leaders','ALLIANCE','Spend time on a coordinated summit focused on shared security and trade.','Schedule summit','dip_summit')}${card('Humanitarian assistance','RELIEF','Provide $2B in emergency humanitarian aid. Can improve relationships and public trust.','Approve aid','dip_aid')}${card('Trade negotiation','ECONOMY','Open negotiations for a limited trade framework. Results are uncertain.','Begin talks','dip_trade')}${card('De-escalation channel','DIPLOMACY','Open a private communication channel to reduce risk during an international dispute.','Open channel','dip_deescalate')}</div><div class="sectionhead"><h2>International relationships</h2></div>${[['Allied confidence',G.foreign],['National stability',G.stability],['Economic confidence',G.economy]].map(([n,v])=>`<div class="barrow"><span>${n}</span><div class="meter"><i style="width:${v}%"></i></div><b>${v}</b></div>`).join('')}`)}
function press(){return shell('Every word has a second life.','PRESS BRIEFING ROOM','Choose a communication approach. Statements influence trust and approval, and the press will ask follow-up questions.',`<div class="grid">${card('Transparent briefing','ON RECORD','Share what is known, what is uncertain, and when more information will be available.','Give briefing','press_open')}${card('Prime-time address','NATIONWIDE','Speak directly to the country about your priorities and the road ahead.','Address nation','prepare_speech')}${card('Correct the record','FACT CHECK','Clarify an earlier statement and acknowledge what has changed.','Issue correction','press_correct')}${card('Take questions','LIVE','Hold a press conference with difficult questions about your record.','Face questions','press_questions')}</div><div class="sectionhead"><h2>Public record</h2></div>${feed(G.log.filter(x=>/statement|press|briefing|address|record/i.test(x.title)).slice(0,8))}`)}
function courts(){return shell('Power has boundaries.','COURTS · CONSTITUTIONAL REVIEW','Courts can block unlawful action. Independent review may be inconvenient, but constitutional compliance protects the legitimacy of the office.',`<div class="grid">${card('Request constitutional review','JUDICIAL','Ask for a legal assessment of a proposed executive action.','Request review','court_review')}${card('Comply with court ruling','RULE OF LAW','Respect a fictional court order and direct agencies to comply.','Comply','court_comply')}${card('Independent inspector review','OVERSIGHT','Commission a review of agency conduct and publish the findings.','Commission review','ethics_review')}${card('Nominate a judge','APPOINTMENTS','Submit a fictional judicial nominee. Confirmation depends on congressional support.','Submit nominee','judge_nominate')}</div><div class="sectionhead"><h2>Legal docket</h2></div>${feed(G.log.filter(x=>/court|legal|review|judge|constitution/i.test(x.title)).slice(0,8))}`)}
function elections(){return shell('Public confidence must be maintained.','PUBLIC OPINION · ELECTIONS','Polls reflect a fictional electorate. Campaign promises, outcomes, and crises all shape public judgment.',`<div class="grid">${card('Listening tour','PUBLIC OUTREACH','Visit communities and hear concerns. Costs time but can build trust.','Start tour','listen')}${card('Publish progress report','ACCOUNTABILITY','Release a factual summary of accomplishments, setbacks, and outstanding goals.','Publish report','progress')}${card('Campaign commitments','PROMISES','Review what you said you would do and whether your administration delivered.','Review commitments','promises')}${card('Election outlook','POLLING','Review current approval and political support. The numbers are estimates, not guarantees.','Review outlook','polls')}</div><div class="sectionhead"><h2>Polling snapshot</h2></div>${[['Approval',G.approval],['Trust',G.trust],['Congressional support',G.support],['Stability',G.stability]].map(([n,v])=>`<div class="barrow"><span>${n}</span><div class="meter"><i style="width:${v}%"></i></div><b>${v}%</b></div>`).join('')}`)}
function legacy(){return shell('What will remain after you leave?','PRESIDENTIAL LEGACY','A presidency is judged by outcomes, institutions, crises handled, and promises kept—not by one poll.',`<div class="grid"><div class="card"><span class="tag">YOUR RECORD</span><h3>Presidency statistics</h3><p>Days in office: ${G.day}<br>Decisions made: ${G.actions}<br>Executive orders: ${G.orders.length}<br>Bills introduced: ${G.bills.length}<br>Term: ${G.term}</p></div><div class="card"><span class="tag gold">LEGACY INDEX</span><h3>${Math.round((G.approval+G.trust+G.stability+G.economy+G.foreign)/5)}/100</h3><p>A snapshot of public approval, trust, stability, economic confidence, and international relationships.</p></div>${card('Give a final address','LEGACY','Reflect on achievements, unfinished work, and the constitutional transfer of power.','Prepare address','final_address')}${card('Start a new presidency','NEW GAME','Begin a fresh fictional term. Your current progress will be replaced only if you confirm.','New presidency','confirm_new')}</div><div class="sectionhead"><h2>Presidential record</h2></div>${feed(G.log.slice(0,15))}`)}
const renderers={briefing,schedule,executive,congress,cabinet,economy,security,diplomacy,press,courts,elections,legacy};
function render(){renderStats();renderNav();$('main').innerHTML=renderers[current]();$('main').querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));$('main').querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.action)));$('nav').querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)))}
function go(s){current=s;G.section=s;render();window.scrollTo({top:0,behavior:'smooth'})}
function spend(hours=1){G.hour+=hours;while(G.hour>=24){G.hour-=24;G.day++;overnight()}G.actions++}
function overnight(){change({approval:-1,trust:-1,stability:-1});log('Overnight intelligence update','Agencies submitted their overnight reports. The situation remains fluid.');if(!G.crisis&&Math.random()<.58)createCrisis()}
function createCrisis(){const events=[
{title:'Federal systems cyber incident',text:'Several public-facing federal services are experiencing disruptions. Attribution is unconfirmed.',choices:[{label:'Coordinate technical response and communicate verified facts',effect:{trust:3,stability:4,approval:1}},{label:'Announce a culprit before the evidence is ready',effect:{trust:-6,stability:-3,approval:-3}},{label:'Bring in independent incident responders',effect:{trust:4,stability:3,treasury:-1} }]},
{title:'Severe storms threaten multiple states',text:'Forecasts indicate dangerous weather and possible infrastructure damage. State officials request federal coordination.',choices:[{label:'Coordinate federal aid with state officials',effect:{trust:3,stability:5,treasury:-2,approval:2}},{label:'Delay action until every forecast is certain',effect:{trust:-4,stability:-5,approval:-3}},{label:'Issue a clear preparedness briefing and mobilize resources',effect:{trust:3,stability:3,treasury:-1} }]},
{title:'Unexpected economic slowdown',text:'New reports suggest weaker hiring and consumer confidence. Analysts disagree about how long it may last.',choices:[{label:'Meet economic advisers and publish a response plan',effect:{economy:4,trust:2,treasury:-1}},{label:'Dismiss the reports without reviewing them',effect:{economy:-5,trust:-4,approval:-3}},{label:'Propose targeted support and seek congressional input',effect:{economy:3,support:2,treasury:-2} }]},
{title:'International diplomatic dispute',text:'An ally requests urgent talks after a public disagreement. The details remain sensitive and incomplete.',choices:[{label:'Open a private diplomatic channel',effect:{foreign:4,stability:2,trust:1}},{label:'Make threats publicly before talks begin',effect:{foreign:-6,stability:-5,approval:-2}},{label:'Consult allies and brief congressional leaders',effect:{foreign:3,support:2,trust:2} }]}];G.crisis=events[Math.floor(Math.random()*events.length)];log('Crisis alert: '+G.crisis.title,G.crisis.text)}
function modal(title,body,buttons){$('modalRoot').innerHTML=`<div class="modalback"><div class="modal"><button class="close" data-close>✕</button><h2>${title}</h2>${body}<div class="actions" style="margin-top:12px">${buttons}</div></div></div>`;$('modalRoot').querySelector('[data-close]').onclick=()=>$('modalRoot').innerHTML='';$('modalRoot').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.action));$('modalRoot').querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{go(b.dataset.nav);$('modalRoot').innerHTML=''})}
function confirmBox(title,text,action){modal(title,`<p>${text}</p>`,`<button class="primary" data-action="${action}">Confirm</button><button data-close>Cancel</button>`);$('modalRoot').querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('modalRoot').innerHTML='')}
function act(a){
if(a==='save'){try{localStorage.setItem('oathPowerSave',JSON.stringify(G));notify('Game saved on this device.')}catch(e){notify('Could not save in this browser.')}return}
if(a==='load'){try{const x=localStorage.getItem('oathPowerSave');if(!x){notify('No saved game found yet.');return}G=JSON.parse(x);current=G.section||'briefing';render();notify('Saved game loaded.')}catch(e){notify('Save could not be loaded.')}return}
if(a==='confirm_new'){confirmBox('Start a new presidency?','This replaces the current in-memory game. Save first if you want to keep it.','new_confirm');return}
if(a==='new_confirm'){G=initial();current='briefing';$('modalRoot').innerHTML='';render();notify('A new presidency begins.');return}
if(a==='advance'||a==='end_day'){spend(a==='advance'?1:(24-G.hour));if(Math.random()<.28&&!G.crisis)createCrisis();log('Time advanced',a==='advance'?'You advanced the presidential clock by one hour.':'A new day begins. Overnight reports have arrived.');current='schedule';render();return}
if(a==='briefing_read'){spend(1);log('Morning intelligence brief','Economic confidence is mixed, congressional support is fragile, and agencies recommend careful verification before major announcements.');change({trust:1});notify('Briefing reviewed.');}
else if(a==='cabinet_meeting'){spend(1);G.cabinet.forEach(c=>c.loyalty=clamp(c.loyalty+2));change({staff:3,trust:1});log('Cabinet meeting','Officials presented competing recommendations. Your team is more aligned, though major policy questions remain.');notify('Cabinet meeting concluded.')}
else if(a==='call_congress'){spend(1);change({support:Math.random()<.6?3:-2});log('Congressional calls','Leadership heard your priorities. Some members want amendments before committing to a vote.');notify('Calls completed.')}
else if(a==='prepare_speech'||a==='press_open'||a==='press_correct'||a==='press_questions'||a==='final_address'){const types={prepare_speech:['Prepare a presidential address','Choose a tone for your statement.',['Measured and transparent','Confident and optimistic','Partisan and confrontational']],press_open:['Press briefing','Select how to brief reporters.',['Share confirmed facts and uncertainties','Keep it brief and defer details','Attack critics and change the subject']],press_correct:['Correct the record','Acknowledge and clarify an earlier statement.',['Own the mistake and explain the correction','Offer a narrow technical clarification','Blame others for the confusion']],press_questions:['Press conference','Reporters will ask about results and setbacks.',['Answer directly, including difficult questions','Give short answers and promise follow-up','Refuse to answer and criticize the press']],final_address:['Final presidential address','Choose the central theme of your legacy.',['Accountability and peaceful transition','Achievements and future challenges','Personal victory over opponents']]};const [t,desc,opts]=types[a];modal(t,`<p>${desc}</p><div class="choice">${opts.map((o,i)=>`<button data-action="speech_${a}_${i}">${o}</button>`).join('')}</div>`,'');return}
else if(a.startsWith('speech_')){const p=a.split('_'),kind=p.slice(1,-1).join('_'),n=Number(p[p.length-1]);spend(1);let effects;if(n===0)effects={trust:4,approval:2,stability:1};else if(n===1)effects={approval:3,trust:1};else effects={approval:-2,trust:-5,support:-2};change(effects);const names=['transparent and accountable','confident and optimistic','confrontational'];log('Presidential statement',`You chose a ${names[n]} communication approach. Public response will depend on results as well as rhetoric.`);$('modalRoot').innerHTML='';notify('Statement delivered.');}
else if(a.startsWith('order_')){const map={order_climate:['Clean Energy and Resilience Directive',{climate:6,energy:3,treasury:-3,approval:2},'Federal agencies are directed to prioritize resilience and clean-energy planning.'],order_workforce:['Federal Workforce Performance Review',{staff:4,trust:1,approval:1},'Agencies begin a performance review with reporting requirements.'],order_emergency:['Emergency Coordination Order',{stability:3,trust:2,treasury:-1},'Federal agencies coordinate response planning under existing legal authority.'],order_relief:['Targeted Student Loan Relief Proposal',{approval:3,trust:2,treasury:-2,support:-1},'A targeted relief proposal is issued for legal and budget review.']};const [title,effect,desc]=map[a];spend(1);change(effect);G.orders.unshift({day:G.day,hour:G.hour,title,text:desc});log(title,desc);notify('Executive action recorded.')}
else if(a.startsWith('bill_')){const map={bill_infra:['Infrastructure and Jobs Act','Repairs roads and bridges, supports jobs, and requires a $5B allocation.','infra'],bill_budget:['Budget Responsibility Framework','A fiscal plan to reduce spending growth and negotiate priorities.','budget'],bill_health:['Healthcare Access Act','Expands access to basic healthcare services with a funding plan.','health'],bill_safety:['Community Public Safety Grants','Funds local public safety programs with transparency and oversight.','safety']};const [title,desc,type]=map[a];if(G.bills.some(b=>b.type===type)){notify('That bill is already pending.');return}spend(1);G.bills.push({title,desc,type,status:'INTRODUCED',votes:0});change({support:1});log('Bill introduced: '+title,'Your team sent the proposal to Congress. Negotiations are underway.');notify('Bill introduced.')}
else if(a.startsWith('negotiate_')){const i=Number(a.split('_')[1]),b=G.bills[i];if(!b)return;spend(1);b.votes=clamp(b.votes+Math.floor(Math.random()*18)+12,0,100);b.status='NEGOTIATING';change({support:2});log('Negotiations: '+b.title,`Negotiators report an estimated ${b.votes}% level of support. This is not a guaranteed vote.`);notify('Negotiations updated.')}
else if(a.startsWith('vote_')){const i=Number(a.split('_')[1]),b=G.bills[i];if(!b)return;spend(1);const chance=clamp(20+G.support*.55+b.votes*.45,5,95),pass=Math.random()*100<chance;if(pass){b.status='PASSED';change({support:3,approval:3,trust:2});if(b.type==='infra')change({treasury:-5,economy:4});if(b.type==='health')change({treasury:-4,health:5,trust:2});if(b.type==='budget')change({economy:2,treasury:2,approval:-1});if(b.type==='safety')change({treasury:-2,stability:3});log('Congress passes '+b.title,`The bill passed in this simulation with an estimated ${Math.round(chance)}% chance of success.`);notify('The bill passed!')}else{b.status='FAILED';change({support:-3,approval:-2,trust:-1});log('Congress rejects '+b.title,`The bill failed. The estimated passage chance was ${Math.round(chance)}%. Your team must reconsider the coalition.`);notify('The vote failed.')} }
else if(a.startsWith('talk_')){const i=Number(a.split('_')[1]),c=G.cabinet[i];spend(1);c.loyalty=clamp(c.loyalty+Math.floor(Math.random()*9)+3);change({staff:1});log('Private briefing with '+c.name,`${c.role} ${c.name} shared concerns and recommendations. Alignment is now ${c.loyalty}/100.`);notify('Briefing complete.')}
else if(a.startsWith('replace_')){const i=Number(a.split('_')[1]),c=G.cabinet[i];confirmBox('Consider replacing '+escapeHTML(c.name)+'?','Replacing a senior official may disrupt the team. This simulation will appoint a fictional interim official.','replace_confirm_'+i);return}
else if(a.startsWith('replace_confirm_')){const i=Number(a.split('_')[2]),c=G.cabinet[i];if(c){const old=c.name;c.name=['Taylor Reed','Morgan Price','Jamie Parker','Casey Jordan','Avery Quinn'][Math.floor(Math.random()*5)];c.loyalty=60;change({staff:-5,support:-1});log('Cabinet change',`${old} was replaced by ${c.name} as ${c.role}. The transition will take time.`)}$('modalRoot').innerHTML='';}
else if(a==='doj_review'||a==='court_review'){spend(1);change({trust:3,stability:1});log('Independent legal review','Counsel reviewed the proposal for constitutional and statutory concerns before implementation.');notify('Legal review requested.')}
else if(a==='ethics_review'){spend(1);change({trust:4,approval:1,staff:-1});log('Ethics and disclosure review','An independent review was authorized with instructions to publish findings and protect due process.');notify('Review opened.')}
else if(a==='court_comply'){spend(1);change({trust:4,stability:3,approval:-1});log('Compliance with court ruling','The administration directed agencies to comply with the court order while pursuing lawful options.');notify('Court ruling acknowledged.')}
else if(a==='judge_nominate'){spend(1);change({support:-1});log('Judicial nomination submitted','A fictional nominee was sent to the Senate. Confirmation hearings are pending.');notify('Nomination submitted.')}
else if(a==='econ_jobs'||a==='econ_small'||a==='econ_deficit'||a==='econ_reserve'){const map={econ_jobs:['Jobs and infrastructure package',{treasury:-5,economy:5,approval:3,stability:1}],econ_small:['Small business credit program',{treasury:-3,economy:3,approval:2}],econ_deficit:['Deficit reduction plan',{treasury:4,economy:1,approval:-2,trust:1}],econ_reserve:['Emergency reserve',{treasury:-2,stability:3,trust:1}]};const [title,effect]=map[a];if(G.treasury+effect.treasury<0){notify('Not enough funds in the treasury.');return}spend(1);change(effect);log(title,'The Treasury implemented the policy. Benefits and trade-offs will continue to develop.');notify('Economic policy recorded.')}
else if(a==='dip_summit'||a==='dip_aid'||a==='dip_trade'||a==='dip_deescalate'){const map={dip_summit:['Allied leaders summit',{foreign:5,trust:1,support:1,treasury:-1}],dip_aid:['Humanitarian assistance',{foreign:4,trust:2,treasury:-2,approval:1}],dip_trade:['Trade negotiations',{foreign:2,economy:2}],dip_deescalate:['Diplomatic de-escalation channel',{foreign:4,stability:3,trust:1}]};const [title,effect]=map[a];if(G.treasury+ (effect.treasury||0)<0){notify('Not enough funds in the treasury.');return}spend(1);change(effect);log(title,'Diplomats began consultations. Progress will depend on counterparties and follow-through.');notify('Diplomatic action recorded.')}
else if(a==='intel'){spend(1);log('Intelligence assessment','Analysts separated confirmed observations from uncertain attribution. They recommend preserving evidence and consulting relevant agencies before public claims.');change({stability:1,trust:1});notify('Assessment reviewed.')}
else if(a==='cyber'){spend(1);change({stability:4,trust:2,treasury:-1});log('Cybersecurity response','Incident responders began containment, evidence preservation, and restoration. Public updates will follow verified findings.');notify('Response coordinated.')}
else if(a==='disaster'){spend(1);change({stability:5,trust:3,treasury:-2,approval:1});log('Disaster response coordination','Federal resources were coordinated with state and local officials based on assessed needs.');notify('Response coordinated.')}
else if(a==='readiness'){spend(1);change({stability:2,staff:1});log('Readiness review','Advisers reviewed preparedness, logistics, and risk-reduction options.');notify('Readiness review completed.')}
else if(a==='listen'){spend(2);change({trust:4,approval:2});log('Community listening tour','You met community leaders and heard concerns about jobs, services, and public safety. Staff were asked to follow up.');notify('Listening tour completed.')}
else if(a==='progress'){spend(1);change({trust:3,approval:1});log('Progress report published','The report included completed actions, unresolved commitments, and the next review dates.');notify('Report published.')}
else if(a==='promises'){modal('Campaign commitments','<p>Your current record reflects decisions made during this presidency. You can still improve outcomes by taking consistent, accountable action.</p><p>Tip: review your orders, bills, and event log to compare promises with results.</p>','');return}
else if(a==='polls'){modal('Election outlook',`<p>Approval: <b>${G.approval}%</b><br>Trust: <b>${G.trust}%</b><br>Congressional support: <b>${G.support}%</b><br>Stability: <b>${G.stability}%</b></p><p>Polling is an estimate. Future events and decisions may change it.</p>`,'');return}
else if(a==='crisis_'+a.split('_')[1]){const i=Number(a.split('_')[1]);if(G.crisis){const c=G.crisis.choices[i];if(c){spend(1);change(c.effect);log('Crisis response: '+G.crisis.title,c.label);G.crisis=null;notify('Crisis decision recorded.')}}}
else{return}
render()
}
$('saveBtn').onclick=()=>act('save');$('loadBtn').onclick=()=>act('load');$('newBtn').onclick=()=>act('confirm_new');
render();
</script>
</body>
